name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sillage
          POSTGRES_PASSWORD: sillage
          POSTGRES_DB: sillage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sillage -d sillage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      DATABASE_URL_TEST: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      DATABASE_URL_TEST_UNPOOLED: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      DATABASE_URL_E2E: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      DATABASE_URL_E2E_UNPOOLED: postgresql://sillage:sillage@localhost:5432/sillage_test?schema=public
      SESSION_PEPPER: ci-session-pepper-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      DEMO_MODE: "1"
      ALLOW_PROD_SEED: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare browser database
        run: node scripts/prepare-e2e-db.mjs
      - name: Browser journeys and accessibility
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
